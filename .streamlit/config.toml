# Light editorial theme applied on first paint, so the page never flashes dark.
[theme]
base = "light"
primaryColor = "#c0392b"
backgroundColor = "#faf9f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#14141a"

[server]
headless = true
enableCORS = false
enableXsrfProtection = false

[browser]
gatherUsageStats = false

[client]
toolbarMode = "minimal"
showErrorDetails = false
